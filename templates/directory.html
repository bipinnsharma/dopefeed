{% extends "base.html" %}
{% block title %}dopefeed — Read what matters{% endblock %}
{% block search %}
<form id="filters" class="topbar-search" role="search" action="/" method="get"
      hx-get="/feeds" hx-trigger="keyup changed delay:300ms, search"
      hx-target="#feed-grid" hx-include="this">
  <input id="search-input" class="search-input" type="search" name="q" value="{{ q }}"
         placeholder="Search feeds…" aria-label="Search feeds" autocomplete="off">
  <input type="hidden" name="category" value="{{ category }}">
  <input type="hidden" name="sort" value="{{ sort }}">
</form>
{% endblock %}
{% block content %}
<section class="directory">
  <div class="filter-row">
    <nav class="chips" aria-label="Categories">
      <a class="chip{% if category == "" %} is-active{% endif %}" href="/?sort={{ sort }}" hx-get="/feeds?sort={{ sort }}"
         hx-target="#feed-grid" hx-include="#search-input">All</a>
      <a class="chip{% if category == "ai" %} is-active{% endif %}" href="/?category=ai&sort={{ sort }}" hx-get="/feeds?category=ai&sort={{ sort }}"
         hx-target="#feed-grid" hx-include="#search-input">AI</a>
      <a class="chip{% if category == "ceo" %} is-active{% endif %}" href="/?category=ceo&sort={{ sort }}" hx-get="/feeds?category=ceo&sort={{ sort }}"
         hx-target="#feed-grid" hx-include="#search-input">CEO</a>
      <a class="chip{% if category == "coding" %} is-active{% endif %}" href="/?category=coding&sort={{ sort }}" hx-get="/feeds?category=coding&sort={{ sort }}"
         hx-target="#feed-grid" hx-include="#search-input">Coding</a>
      <a class="chip{% if category == "design" %} is-active{% endif %}" href="/?category=design&sort={{ sort }}" hx-get="/feeds?category=design&sort={{ sort }}"
         hx-target="#feed-grid" hx-include="#search-input">Design</a>
      <a class="chip{% if category == "dev" %} is-active{% endif %}" href="/?category=dev&sort={{ sort }}" hx-get="/feeds?category=dev&sort={{ sort }}"
         hx-target="#feed-grid" hx-include="#search-input">Dev</a>
      <a class="chip{% if category == "lifestyle" %} is-active{% endif %}" href="/?category=lifestyle&sort={{ sort }}" hx-get="/feeds?category=lifestyle&sort={{ sort }}"
         hx-target="#feed-grid" hx-include="#search-input">Lifestyle</a>
      <a class="chip{% if category == "product" %} is-active{% endif %}" href="/?category=product&sort={{ sort }}" hx-get="/feeds?category=product&sort={{ sort }}"
         hx-target="#feed-grid" hx-include="#search-input">Product</a>
      <a class="chip{% if category == "startup" %} is-active{% endif %}" href="/?category=startup&sort={{ sort }}" hx-get="/feeds?category=startup&sort={{ sort }}"
         hx-target="#feed-grid" hx-include="#search-input">Startups</a>
      <a class="chip{% if category == "tech" %} is-active{% endif %}" href="/?category=tech&sort={{ sort }}" hx-get="/feeds?category=tech&sort={{ sort }}"
         hx-target="#feed-grid" hx-include="#search-input">Tech</a>
      <a class="chip{% if category == "writing" %} is-active{% endif %}" href="/?category=writing&sort={{ sort }}" hx-get="/feeds?category=writing&sort={{ sort }}"
         hx-target="#feed-grid" hx-include="#search-input">Writing</a>
      <a class="chip{% if category == "youtube" %} is-active{% endif %}" href="/?category=youtube&sort={{ sort }}" hx-get="/feeds?category=youtube&sort={{ sort }}"
         hx-target="#feed-grid" hx-include="#search-input">YouTube</a>
    </nav>
    <form class="sort-form" method="get" action="/">
      <input type="hidden" name="category" value="{{ category }}">
      <input type="hidden" name="q" value="{{ q }}">
      <select class="sort-select" name="sort" data-autosubmit aria-label="Sort feeds">
        <option value="recent"{% if sort == "recent" %} selected{% endif %}>Recent</option>
        <option value="popular"{% if sort == "popular" %} selected{% endif %}>Popular</option>
        <option value="oldest"{% if sort == "oldest" %} selected{% endif %}>Oldest</option>
      </select>
    </form>
  </div>

  <div id="feed-grid">
  {% include "_feed_grid.html" %}
  </div>
</section>
{% endblock %}
