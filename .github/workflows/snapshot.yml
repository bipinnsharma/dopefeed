name: Publish feed snapshot

on:
  schedule:
    - cron: "0 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Configure snapshot commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test runner
        run: |
          python -m pip install -r scripts/tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Restore latest feed database
        run: |
          mkdir -p data
          curl -fsSL "$(cat data/snapshot.txt)" | xz -dc > data/dopefeed.db
      - name: Refresh and publish snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/snapshot.sh
