{% if has_more %}
<div id="feed-more" class="load-more">
  <button type="button" class="button-secondary"
          hx-get="/feeds?category={{ category|urlencode }}&q={{ q|urlencode }}&page={{ page + 1 }}&more=1"
          hx-target="#feed-more" hx-swap="outerHTML">Load more</button>
</div>
{% endif %}
