<article class="feed-card">
  <div class="feed-card-head">
    <img class="feed-icon feed-avatar" src="{{ feed.avatar_url.as_deref().unwrap_or("/static/no-image-dl.jpg") }}"
         alt="{{ feed.title }}" width="48" height="48" loading="lazy"
         onerror="this.src='/static/no-image-dl.jpg'">
    <div class="feed-card-text">
      <h2 class="feed-card-title"><a href="/f/{{ feed.id }}">{{ feed.title }}</a></h2>
      <p class="feed-card-category">{{ feed.category_label() }}</p>
    </div>
    <button type="button" class="subscribe" data-feed-id="{{ feed.id }}" aria-pressed="false"
            aria-label="Subscribe to {{ feed.title }}" title="Subscribe">+</button>
  </div>
  {% if let Some(description) = feed.description %}<p class="feed-card-desc">{{ description }}</p>{% endif %}
  <p class="feed-card-meta">
    {% if feed.is_new() %}<span class="new-pill">new post</span>{% endif %}
    <span class="feed-card-count">{% if feed.post_count == 1 %}1 post{% else %}{{ feed.post_count }} posts{% endif %}</span>
  </p>
</article>
